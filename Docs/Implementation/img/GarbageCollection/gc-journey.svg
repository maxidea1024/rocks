<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc">
<title id="title">객체의 생성부터 최종 회수까지</title>
<desc id="desc">생성 공개, 소유와 사용, 참조 변경, 종료, 도달성 판정, 저장소 회수의 여섯 단계. 논리적 파괴와 실제 회수는 별개이며 장벽은 참조 변경을 보호한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#183142}.title{font-size:22px;font-weight:700}.head{font-size:17px;font-weight:700}.small{font-size:14px;fill:#405869}.panel{fill:#f4f8fb;stroke:#bccfda}.end{fill:#f4faf7;stroke:#b8d6c4}.num{font-size:24px;fill:#507d96;font-weight:700}</style>
<rect width="960" height="460" fill="#fff"/><text x="24" y="35" class="title">하나의 객체를 생성부터 회수까지 따라가기</text><text x="24" y="62" class="small">위쪽 왼쪽부터 1 → 6 순서로 읽는다. 필요한 객체의 생존과 실제 저장소 해제를 따로 관리한다.</text>
<g transform="translate(20 82)"><rect class="panel" width="292" height="142" rx="10"/><text x="18" y="34" class="num">1</text><text x="50" y="34" class="head">생성 · 공개</text><text x="18" y="68" class="small">타입 등록과 생성 트랜잭션</text><text x="18" y="94" class="small">World 객체는 Spawn API</text><text x="18" y="122" class="small">루트와 소유 관계를 만든다.</text></g>
<g transform="translate(334 82)"><rect class="panel" width="292" height="142" rx="10"/><text x="18" y="34" class="num">2</text><text x="50" y="34" class="head">보유 · 사용</text><text x="18" y="68" class="small">RootRef와 강한 참조로 유지</text><text x="18" y="94" class="small">Borrow로 잠깐 접근</text><text x="18" y="122" class="small">handle만으로는 생존하지 않는다.</text></g>
<g transform="translate(648 82)"><rect class="panel" width="292" height="142" rx="10"/><text x="18" y="34" class="num">3</text><text x="50" y="34" class="head">참조 변경</text><text x="18" y="68" class="small">SetReference 등 지원 API 사용</text><text x="18" y="94" class="small">Marking 중 새 대상은 장벽 보호</text><text x="18" y="122" class="small">Trace는 모든 강한 간선을 방문.</text></g>
<g transform="translate(20 242)"><rect class="end" width="292" height="142" rx="10"/><text x="18" y="34" class="num">4</text><text x="50" y="34" class="head">사용 종료</text><text x="18" y="68" class="small">필요 시 논리 파괴 · 수명 hook</text><text x="18" y="94" class="small">루트와 불필요한 참조 반환</text><text x="18" y="122" class="small">파괴 요청 ≠ 즉시 메모리 해제</text></g>
<g transform="translate(334 242)"><rect class="end" width="292" height="142" rx="10"/><text x="18" y="34" class="num">5</text><text x="50" y="34" class="head">GC 도달성 판정</text><text x="18" y="68" class="small">Borrow를 놓은 safepoint</text><text x="18" y="94" class="small">표식 → 마감 → Retired 분류</text><text x="18" y="122" class="small">이미 표식되면 후속 cycle 필요.</text></g>
<g transform="translate(648 242)"><rect class="end" width="292" height="142" rx="10"/><text x="18" y="34" class="num">6</text><text x="50" y="34" class="head">저장소 회수</text><text x="18" y="68" class="small">회수 조건 해소 후 소멸자 실행</text><text x="18" y="94" class="small">본체 해제 · 슬롯 재사용</text><text x="18" y="122" class="small">chunk·큐 버퍼는 남을 수 있다.</text></g>
<text x="24" y="424" class="small">GC는 사용 중에도 반복된다. 명시적 파괴 요청 없이 도달 불가능해진 객체도 수집할 수 있다.</text>
</svg>
