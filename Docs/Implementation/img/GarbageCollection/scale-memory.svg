<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="title desc">
<title id="title">생존 객체 수와 관리 저장소의 수명은 다르다</title>
<desc id="desc">300만 객체 피크 이후 10만만 생존해도 슬롯 chunk와 증분 작업 큐 capacity는 유지된다. Registry를 종료하고 소멸하면 관리 버퍼를 반환한다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#183142}.title{font-size:22px;font-weight:700}.head{font-size:16px;font-weight:700}.small{font-size:14px;fill:#405869}.live{fill:#e4f4ec;stroke:#69a789}.meta{fill:#e6f2fa;stroke:#83a4bc}.panel{fill:#fafbfd;stroke:#d2dce4}</style>
<rect width="960" height="370" fill="#fff"/><text x="24" y="36" class="title">객체를 회수해도 슬롯과 큐는 바로 줄지 않는다</text>
<g transform="translate(20 58)"><rect class="panel" width="292" height="222" rx="10"/><text x="18" y="30" class="head">1  피크: 객체 300만 개</text><rect class="live" x="18" y="52" width="256" height="45" rx="6"/><text x="32" y="80" class="small">생존 객체 본체와 데이터</text><rect class="meta" x="18" y="110" width="256" height="70" rx="6"/><text x="32" y="138" class="small">슬롯 chunk · 표식 큐 등</text><text x="32" y="161" class="small">관리 저장소도 함께 성장</text><text x="18" y="204" class="small">총 메모리는 본체 + 관리 비용</text></g>
<g transform="translate(334 58)"><rect class="panel" width="292" height="222" rx="10"/><text x="18" y="30" class="head">2  회수 후 생존 10만 개</text><rect class="live" x="18" y="52" width="256" height="45" rx="6"/><text x="32" y="80" class="small">객체 대부분은 회수됨</text><rect class="meta" x="18" y="110" width="256" height="70" rx="6"/><text x="32" y="138" class="small">기존 chunk와 큐 capacity</text><text x="32" y="161" class="small">계속 유지 · 빈 슬롯 재사용</text><text x="18" y="204" class="small">다음 슬롯 스캔도 피크 규모</text></g>
<g transform="translate(648 58)"><rect class="panel" width="292" height="222" rx="10"/><text x="18" y="30" class="head">3  Registry 종료 후 소멸</text><text x="18" y="79" class="small">모든 보유권·객체 정리 성공</text><text x="18" y="113" class="small">→ Registry C++ 객체 소멸</text><text x="18" y="147" class="small">→ chunk·관리 버퍼 반환</text><text x="18" y="189" class="small">allocator → OS 반환 시점은</text><text x="18" y="211" class="small">별도 정책에 따름</text></g>
<rect x="20" y="299" width="920" height="48" rx="8" fill="#fff5df" stroke="#d8b76e"/><text x="38" y="329" class="small">개념도이며 면적은 용량 비율이 아니다. 서브 Level 제거만으로 World의 Registry가 소멸하지는 않는다.</text>
</svg>
