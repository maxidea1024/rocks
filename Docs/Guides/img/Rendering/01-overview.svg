<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc">
<title id="title">Rocks 엔진과 렌더링을 이루는 모듈</title>
<desc id="desc">게임·콘텐츠, 엔진 루프, 렌더, 셰이더, Graphics, Core 여섯 층. 위 층이 아래 층을 쓴다. 상자 색은 구현 상태를 뜻한다.</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#183142}.title{font-size:22px;font-weight:700}.head{font-size:14px;font-weight:700}.small{font-size:12px;fill:#405869}.layer{font-size:14px;font-weight:700;fill:#2f4c60}
.impl{fill:#e4f4ec;stroke:#69a789}.wip{fill:#fff5df;stroke:#e1ba63}.design{fill:#e6f2fa;stroke:#6c9ab7}.later{fill:#f2f4f6;stroke:#b5bec6}.band{fill:#fafcfd;stroke:#e1e8ed}
</style>
<rect width="960" height="640" fill="#fff"/>
<text x="24" y="34" class="title">Rocks 엔진과 렌더링을 이루는 모듈</text>
<text x="24" y="58" class="small">위 층이 아래 층을 쓴다. 아래 층은 위 층을 모른다. 상자 색은 2026-11-17 기준 구현 상태다.</text>
