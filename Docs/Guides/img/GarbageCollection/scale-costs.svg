<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
<title id="title">수백만 객체에서 비용이 쌓이는 위치</title>
<desc id="desc">게임 정리와 Begin은 Step 예산 밖이다. Marking은 객체와 간선, sweep은 빈 슬롯을 포함한 슬롯 수, reclaim은 소멸자 비용에 영향을 받는다. 단일 Trace와 소멸자는 중단되지 않는다.</desc>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#183142}.title{font-size:22px;font-weight:700}.head{font-size:17px;font-weight:700}.small{font-size:14px;fill:#405869}.num{font-size:22px;font-weight:700;fill:#537e97}.box{fill:#f4f8fb;stroke:#b9cdd9}.warn{fill:#fff5df;stroke:#d8b76e}</style>
<rect width="960" height="470" fill="#fff"/><text x="24" y="36" class="title">작은 GC 예산이 전체 정리 시간을 제한하지는 않는다</text>
<rect class="warn" x="20" y="60" width="450" height="112" rx="10"/><text x="38" y="92" class="num">1</text><text x="75" y="92" class="head">게임 수명 정리 · 예산 밖</text><text x="40" y="122" class="small">DestroyLevel · FlushDestroys</text><text x="40" y="148" class="small">Actor/Component 순회 · hook · 참조 정리</text>
<rect class="warn" x="490" y="60" width="450" height="112" rx="10"/><text x="508" y="92" class="num">2</text><text x="545" y="92" class="head">Begin · Step 예산 밖</text><text x="510" y="122" class="small">할당된 전체 슬롯 S 검사 · 필요 시 큐 확보</text><text x="510" y="148" class="small">live가 줄어도 과거에 확보한 슬롯은 남음</text>
<rect class="box" x="20" y="190" width="292" height="169" rx="10"/><text x="38" y="224" class="num">3</text><text x="75" y="224" class="head">Marking</text><text x="40" y="256" class="small">방문 객체 L + 참조 E</text><text x="40" y="283" class="small">단일 Trace는 중단 불가</text><text x="40" y="320" class="small">Level 하나의 100만 참조도</text><text x="40" y="341" class="small">한 번의 Trace 안에서 방문</text>
<rect class="box" x="334" y="190" width="292" height="169" rx="10"/><text x="352" y="224" class="num">4</text><text x="389" y="224" class="head">Sweeping</text><text x="354" y="256" class="small">캡처된 슬롯 S 순회</text><text x="354" y="283" class="small">빈 슬롯도 예산 소비</text><text x="354" y="320" class="small">작은 예산 → 많은 Step</text><text x="354" y="341" class="small">cycle 완료가 늦어질 수 있음</text>
<rect class="box" x="648" y="190" width="292" height="169" rx="10"/><text x="666" y="224" class="num">5</text><text x="703" y="224" class="head">Reclaiming</text><text x="668" y="256" class="small">회수 객체 R · 소멸자</text><text x="668" y="283" class="small">단일 소멸자는 중단 불가</text><text x="668" y="320" class="small">미분류 후보 검사 횟수는</text><text x="668" y="341" class="small">maxObjects에 포함되지 않음</text>
<rect x="20" y="380" width="920" height="65" rx="10" fill="#eef7f1" stroke="#b8d6c4"/><text x="40" y="407" class="head">각 구간의 시간과 프레임 합계를 따로 측정</text><text x="40" y="432" class="small">객체 수뿐 아니라 슬롯 피크, 총 참조 수, 한 객체의 최대 참조 수, 보유권 지연을 함께 본다.</text>
</svg>
