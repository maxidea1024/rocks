<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="title desc">
<title id="title">프레임 사이의 점진 수집과 병렬 표식</title>
<desc id="desc">소유 스레드의 게임 작업 사이에 Begin과 Step이 실행된다. Step 내부의 병렬 worker는 Step이 끝나기 전에 모두 완료된다.</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#183142}.title{font-size:21px;font-weight:700}.head{font-size:15px;font-weight:700}.small{font-size:13px;fill:#405869}.label{font-size:13px;font-weight:700;text-anchor:middle}.game{fill:#e4f4ec;stroke:#69a789}.gc{fill:#e6f2fa;stroke:#6c9ab7}.worker{fill:#f1eafe;stroke:#9d87c1}.rail{stroke:#a7b6c0;stroke-width:2}.note{fill:#fff5df;stroke:#e1ba63}
</style>
<rect width="960" height="350" fill="#fff"/><text x="25" y="33" class="title">한 cycle을 여러 slice로 나누어 실행</text>
<text x="25" y="68" class="small">시간 →</text><text x="25" y="105" class="head">소유 스레드</text><line class="rail" x1="150" y1="100" x2="930" y2="100"/>
<rect class="game" x="150" y="78" width="125" height="44" rx="6"/><text class="label" x="212" y="105">게임 작업</text>
<rect class="gc" x="280" y="78" width="112" height="44" rx="6"/><text class="label" x="336" y="105">Begin</text>
<rect class="game" x="397" y="78" width="125" height="44" rx="6"/><text class="label" x="459" y="105">게임 작업</text>
<rect class="gc" x="527" y="78" width="112" height="44" rx="6"/><text class="label" x="583" y="105">Step 1</text>
<rect class="game" x="644" y="78" width="125" height="44" rx="6"/><text class="label" x="706" y="105">게임 작업</text>
<rect class="gc" x="774" y="78" width="112" height="44" rx="6"/><text class="label" x="830" y="105">Step 2 …</text>
<text x="25" y="180" class="head">선택적 worker</text><line class="rail" x1="150" y1="175" x2="930" y2="175"/>
<rect class="worker" x="539" y="153" width="86" height="44" rx="6"/><text class="label" x="582" y="180">병렬 Trace</text>
<rect class="worker" x="786" y="153" width="86" height="44" rx="6"/><text class="label" x="829" y="180">병렬 Trace</text>
<path d="M527 126 V145 M639 126 V145 M774 126 V145 M886 126 V145" stroke="#9d87c1" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="25" y="234" class="small">worker는 해당 Step 안에서만 실행되고, 모두 끝난 뒤 Step이 반환된다.</text>
<rect class="note" x="20" y="255" width="920" height="72" rx="9"/>
<text x="38" y="281" class="small">Begin과 Step은 Borrow와 활성 생성 트랜잭션이 없는 소유 스레드 safepoint에서 호출한다.</text>
<text x="38" y="304" class="small">Step 사이 게임 작업이 재개된다. Marking 중 참조 변경에는 삽입 장벽이 적용된다.</text>
</svg>
