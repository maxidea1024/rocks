<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 136" width="900" height="136" role="img">
<title>변경 효과 처리 순서</title>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #f5f7fa; stroke: #b9c2cc; stroke-width: 1.2; }
  .rk { fill: #eaf3f5; stroke: #5f8f9c; stroke-width: 1.4; }
  .grp { fill: none; stroke: #b9c2cc; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .ln { stroke: #8c98a4; stroke-width: 1.6; fill: none; }
  .ah { fill: #8c98a4; }
  text { font-family: Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #1f2933; }
  .col { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #52606d; }
  .t { font-size: 15px; font-weight: 700; }
  .ts { font-size: 13px; font-weight: 700; }
  .s { font-size: 12.5px; fill: #3e4c59; }
  .ss { font-size: 11.5px; fill: #3e4c59; }
  .m { font-family: Consolas, 'SF Mono', Menlo, monospace; }
  .lab { font-size: 11.5px; fill: #52606d; }
  .badge { fill: #ffffff; stroke: #8c98a4; stroke-width: 1; }
  .bt { font-size: 10.5px; font-weight: 700; fill: #3e4c59; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" x="0" y="0" width="900" height="136"/>
<rect x="10" y="44" width="112" height="56" rx="4" class="rk"/>
<text x="66" y="67" text-anchor="middle" class="ts">생성 setter</text>
<text x="66" y="86" text-anchor="middle" class="ss">비교 · 대입 · 통지</text>
<line x1="122" y1="72" x2="148" y2="72" class="ln" marker-end="url(#a)"/>
<rect x="152" y="44" width="112" height="56" rx="4" class="rk"/>
<text x="208" y="67" text-anchor="middle" class="ts">dirty 플래그</text>
<text x="208" y="86" text-anchor="middle" class="ss">Affects 값 누적</text>
<line x1="264" y1="72" x2="290" y2="72" class="ln" marker-end="url(#a)"/>
<rect x="294" y="14" width="596" height="110" rx="6" class="grp"/>
<text x="306" y="33" class="ss">UI 갱신 단계 — 프레임당 1회, 왼쪽부터 순서대로</text>
<rect x="304" y="46" width="88" height="62" rx="4" class="box"/>
<text x="348" y="72" text-anchor="middle" class="ts m">Theme</text>
<text x="348" y="92" text-anchor="middle" class="ss">캐시 재해석</text>
<rect x="398" y="46" width="88" height="62" rx="4" class="box"/>
<text x="442" y="72" text-anchor="middle" class="ts m">Shape</text>
<text x="442" y="92" text-anchor="middle" class="ss">텍스트 shaping</text>
<rect x="492" y="46" width="88" height="62" rx="4" class="box"/>
<text x="536" y="72" text-anchor="middle" class="ts m">MinSize</text>
<text x="536" y="92" text-anchor="middle" class="ss">자식 → 부모</text>
<rect x="586" y="46" width="88" height="62" rx="4" class="box"/>
<text x="630" y="72" text-anchor="middle" class="ts m">Layout</text>
