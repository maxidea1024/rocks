<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img">
<title>두 층 구조와 Rocks 모듈</title>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #f5f7fa; stroke: #b9c2cc; stroke-width: 1.2; }
  .rk { fill: #eaf3f5; stroke: #5f8f9c; stroke-width: 1.4; }
  .obj { fill: #f3effa; stroke: #7d6aa6; stroke-width: 1.4; }
  .grp { fill: none; stroke: #b9c2cc; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .ln { stroke: #8c98a4; stroke-width: 1.6; fill: none; }
  .ah { fill: #8c98a4; }
  text { font-family: Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #1f2933; }
  .col { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #52606d; }
  .t { font-size: 15px; font-weight: 700; }
  .s { font-size: 12.5px; fill: #3e4c59; }
  .ss { font-size: 11.5px; fill: #52606d; }
  .lab { font-size: 11.5px; fill: #52606d; }
  .badge { fill: #ffffff; stroke: #8c98a4; stroke-width: 1; }
  .bt { font-size: 10.5px; font-weight: 700; fill: #3e4c59; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" x="0" y="0" width="820" height="560"/>

<text x="20" y="28" class="col">작성 경로</text>
<rect x="20" y="40" width="380" height="70" rx="4" class="box"/>
<text x="36" y="66" class="t">에디터 · 도구 (Rocks Studio, Rocks Lens)</text>
<text x="36" y="90" class="s">EditorFramework: 메뉴 등록 · Inspector · 자산 편집기</text>
<rect x="420" y="40" width="380" height="70" rx="4" class="box"/>
<text x="436" y="66" class="t">게임 UI (HUD · 메뉴 · 인벤토리)</text>
<text x="436" y="90" class="s">WidgetAsset + 컨트롤러(C++ · Sparks) · Designer</text>

<text x="20" y="140" class="col">OBJECT 층</text>
<rect x="420" y="150" width="380" height="110" rx="4" class="obj"/>
<text x="436" y="176" class="t">UiWidget · UiScreens</text>
<text x="436" y="198" class="s">Widget(rocks::Object) · WidgetSlot · UserWidget</text>
<text x="436" y="218" class="s">WidgetTree · 바인딩 · UI 애니메이션 · 화면 스택</text>
<text x="436" y="240" class="ss">리플렉션 · GC · 직렬화 · Transaction (CU1–CU9)</text>
<rect x="748" y="160" width="40" height="18" rx="9" class="badge"/><text x="768" y="173" text-anchor="middle" class="bt">CPU</text>

<line x1="610" y1="112" x2="610" y2="146" class="ln" marker-end="url(#a)"/>
<line x1="340" y1="112" x2="340" y2="306" class="ln" marker-end="url(#a)"/>
<text x="236" y="214" class="lab">Element 직접 사용</text>
<line x1="610" y1="262" x2="610" y2="306" class="ln" marker-end="url(#a)"/>
<text x="622" y="282" class="lab">Element 약한 참조</text>
<text x="622" y="298" class="lab">root 유지 Element</text>

<text x="20" y="300" class="col">ELEMENT 층 (비객체 · 공유 포인터 소유)</text>
<rect x="20" y="310" width="780" height="120" rx="4" class="rk"/>
<text x="36" y="336" class="t">UiFramework</text>
<text x="36" y="358" class="s">ui::Application: 라우팅 · 사용자 · focus · navigation</text>
<text x="36" y="378" class="s">drag · menu · modal · 표준 Element · 목록 가상화</text>
<line x1="440" y1="322" x2="440" y2="418" class="grp"/>
<text x="456" y="336" class="t">UiCore</text>
<text x="456" y="358" class="s">Element · slot · 속성 · 무효화 사유 · Geometry</text>
<text x="456" y="378" class="s">그리기 목록 · clip · cache root · hit grid · 스타일</text>
<text x="456" y="398" class="s">ui::Window · renderer 계약 · batcher</text>
<rect x="748" y="320" width="40" height="18" rx="9" class="badge"/><text x="768" y="333" text-anchor="middle" class="bt">CPU</text>
<text x="36" y="398" class="s">텍스트 편집 · 명령 · 독 배치</text>
<text x="36" y="420" class="ss">TextLayout: 조합 글꼴 · shaping · BiDi · 경계 · SDF · 레이아웃 모델</text>

<text x="20" y="460" class="col">출력 · 플랫폼</text>
<rect x="20" y="470" width="380" height="70" rx="4" class="box"/>
<text x="36" y="496" class="t">UiRender</text>
<text x="36" y="518" class="s">Graphics 제출 · atlas · viewport 합성 · 빈 renderer</text>
<rect x="420" y="470" width="380" height="70" rx="4" class="box"/>
<text x="436" y="496" class="t">PlatformWindow (ui::Platform 계약)</text>
<text x="436" y="518" class="s">다중 창 · DPI · IME · clipboard · cursor · 접근성</text>
<line x1="210" y1="432" x2="210" y2="466" class="ln" marker-end="url(#a)"/>
<line x1="610" y1="466" x2="610" y2="432" class="ln" marker-end="url(#a)"/>
</svg>
