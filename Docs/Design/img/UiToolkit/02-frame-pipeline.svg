<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img">
<title>프레임 처리 순서</title>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #eaf3f5; stroke: #5f8f9c; stroke-width: 1.4; }
  .out { fill: #f5f7fa; stroke: #b9c2cc; stroke-width: 1.2; }
  .ln { stroke: #8c98a4; stroke-width: 1.6; fill: none; }
  .fb { stroke: #b0703a; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
  .ah { fill: #8c98a4; }
  .ahf { fill: #b0703a; }
  text { font-family: Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #1f2933; }
  .t { font-size: 13.5px; font-weight: 700; }
  .s { font-size: 11.5px; fill: #3e4c59; }
  .lab { font-size: 11.5px; fill: #8a5a2e; }
  .n { font-size: 11px; font-weight: 700; fill: #5f8f9c; }
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahf"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="820" height="300"/>

<rect x="16" y="60" width="140" height="110" rx="4" class="box"/>
<text x="26" y="80" class="n">1–3</text>
<text x="26" y="100" class="t">입력</text>
<text x="26" y="120" class="s">전처리기 → capture</text>
<text x="26" y="138" class="s">preview tunnel</text>
<text x="26" y="156" class="s">→ bubble → 응답 적용</text>

<rect x="176" y="60" width="150" height="110" rx="4" class="box"/>
<text x="186" y="80" class="n">4</text>
<text x="186" y="100" class="t">무효화 · 원하는 크기</text>
<text x="186" y="120" class="s">속성 getter 갱신</text>
<text x="186" y="138" class="s">자식 → 부모 계산·cache</text>
<text x="186" y="156" class="s">배율 = 앱 × 창 DPI</text>

<rect x="346" y="60" width="150" height="110" rx="4" class="box"/>
<text x="356" y="80" class="n">5</text>
<text x="356" y="100" class="t">배치 · 그리기</text>
<text x="356" y="120" class="s">부모 → 자식 geometry</text>
<text x="356" y="138" class="s">clip · layer · 그리기 목록</text>
<text x="356" y="156" class="s">cache root 재사용</text>

<rect x="516" y="60" width="130" height="110" rx="4" class="box"/>
<text x="526" y="80" class="n">5</text>
<text x="526" y="100" class="t">hit grid 등록</text>
<text x="526" y="120" class="s">그린 위치 · layer</text>
<text x="526" y="138" class="s">셀 128 px 격자</text>

<rect x="666" y="60" width="138" height="110" rx="4" class="out"/>
<text x="676" y="80" class="n">6</text>
<text x="676" y="100" class="t">batch · 렌더</text>
<text x="676" y="120" class="s">DrawBatcher(UiCore)</text>
<text x="676" y="138" class="s">UiRender → Graphics</text>
<text x="676" y="156" class="s">또는 빈 renderer</text>

<line x1="158" y1="115" x2="172" y2="115" class="ln" marker-end="url(#a)"/>
<line x1="328" y1="115" x2="342" y2="115" class="ln" marker-end="url(#a)"/>
<line x1="498" y1="115" x2="512" y2="115" class="ln" marker-end="url(#a)"/>
<line x1="648" y1="115" x2="662" y2="115" class="ln" marker-end="url(#a)"/>

<path d="M581,172 L581,226 L86,226 L86,176" class="fb" marker-end="url(#f)"/>
<text x="260" y="246" class="lab">다음 프레임의 hit test는 이번 프레임에 그려진 위치를 사용한다</text>
<text x="16" y="34" class="s">무효화 사유: Layout · Paint · Volatility · ChildOrder · RenderTransform · Visibility · AttributeRegistration · Prepass</text>
</svg>
