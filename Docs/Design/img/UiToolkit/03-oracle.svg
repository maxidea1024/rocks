<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="820" height="150" role="img">
<title>Godot 오라클 비교 흐름</title>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #f5f7fa; stroke: #b9c2cc; stroke-width: 1.2; }
  .rk { fill: #eaf3f5; stroke: #5f8f9c; stroke-width: 1.4; }
  .grp { fill: none; stroke: #b9c2cc; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .ln { stroke: #8c98a4; stroke-width: 1.6; fill: none; }
  .ah { fill: #8c98a4; }
  text { font-family: Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #1f2933; }
  .col { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #52606d; }
  .t { font-size: 15px; font-weight: 700; }
  .ts { font-size: 13px; font-weight: 700; }
  .s { font-size: 12.5px; fill: #3e4c59; }
  .ss { font-size: 11.5px; fill: #3e4c59; }
  .m { font-family: Consolas, 'SF Mono', Menlo, monospace; }
  .lab { font-size: 11.5px; fill: #52606d; }
  .badge { fill: #ffffff; stroke: #8c98a4; stroke-width: 1; }
  .bt { font-size: 10.5px; font-weight: 700; fill: #3e4c59; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" x="0" y="0" width="820" height="150"/>
<rect x="10" y="47" width="170" height="56" rx="4" class="rk"/>
<text x="95" y="70" text-anchor="middle" class="ts">장면 정의</text>
<text x="95" y="89" text-anchor="middle" class="ss">중립 JSON · 이벤트 시퀀스</text>
<rect x="230" y="10" width="200" height="56" rx="4" class="box"/>
<text x="330" y="33" text-anchor="middle" class="ts">Godot 4.x 헤드리스</text>
<text x="330" y="52" text-anchor="middle" class="ss">생성 스크립트 → 결과 덤프</text>
<rect x="230" y="84" width="200" height="56" rx="4" class="rk"/>
<text x="330" y="107" text-anchor="middle" class="ts">Rocks CPU-only</text>
<text x="330" y="126" text-anchor="middle" class="ss">같은 정의 → 결과 덤프</text>
<rect x="475" y="47" width="160" height="56" rx="4" class="rk"/>
<text x="555" y="70" text-anchor="middle" class="ts">비교기</text>
<text x="555" y="89" text-anchor="middle" class="ss">rect · 수신 순서 · 해석값</text>
<rect x="670" y="47" width="140" height="56" rx="4" class="rk"/>
<text x="740" y="70" text-anchor="middle" class="ts">판정</text>
<text x="740" y="89" text-anchor="middle" class="ss">통과 · 의도적 차이 목록</text>
<path d="M180,68 L226,40" class="ln" marker-end="url(#a)"/>
<path d="M180,82 L226,110" class="ln" marker-end="url(#a)"/>
<path d="M430,40 L471,66" class="ln" marker-end="url(#a)"/>
<path d="M430,110 L471,84" class="ln" marker-end="url(#a)"/>
<line x1="635" y1="75" x2="666" y2="75" class="ln" marker-end="url(#a)"/>
