<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
<title id="title">스레드와 lane</title>
<desc id="desc">게임 lane, worker pool, 렌더 lane, IO 완료 worker, GPU queue 다섯 실행 주체와 그 사이에 오가는 것. 게임 lane은 렌더 lane에 값만 넘기고, 렌더 lane은 완료 통지로 결과를 돌려준다.</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#183142}.title{font-size:22px;font-weight:700}.head{font-size:15px;font-weight:700}.small{font-size:12px;fill:#405869}.lbl{font-size:12px;fill:#183142;font-weight:700}
.game{fill:#e4f4ec;stroke:#69a789}.worker{fill:#f1eafe;stroke:#9d87c1}.render{fill:#fff5df;stroke:#e1ba63}.io{fill:#e6f2fa;stroke:#6c9ab7}.gpu{fill:#f2f4f6;stroke:#8a98a4}.arrow{stroke:#5c7385;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#5c7385;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c7385"/></marker></defs>
<rect width="960" height="520" fill="#fff"/>
<text x="24" y="34" class="title">누가 어디서 도는가: 스레드와 lane</text>
<text x="24" y="58" class="small">실선은 일을 넘기는 방향, 점선은 완료·결과가 돌아오는 방향이다. 서로를 동기로 기다리는 일은 없다(게임 lane의 slot 확보만 예외).</text>

<g transform="translate(24 84)"><rect class="game" width="250" height="170" rx="10"/><text x="14" y="28" class="head">게임 lane</text><text x="14" y="50" class="small">메인 스레드 = 창 스레드</text><text x="14" y="78" class="small">• 엔진 루프·World Tick</text><text x="14" y="98" class="small">• 객체 가변 상태의 유일한 주인</text><text x="14" y="118" class="small">• 렌더 추출 → 프레임 packet</text><text x="14" y="138" class="small">• 상주 계획(스트리밍) 시작</text><text x="14" y="158" class="small">• GPU를 직접 만지지 않는다</text></g>

<g transform="translate(24 330)"><rect class="worker" width="250" height="150" rx="10"/><text x="14" y="28" class="head">worker pool</text><text x="14" y="50" class="small">WorkerScheduler (Core Task)</text><text x="14" y="78" class="small">• ParallelFor·직렬 체인</text><text x="14" y="98" class="small">• 컬링·애니메이션·packet 생성</text><text x="14" y="118" class="small">• 상주 계획 계산</text><text x="14" y="138" class="small">• 객체 필드를 바꾸지 않는다</text></g>

<g transform="translate(372 84)"><rect class="render" width="250" height="210" rx="10"/><text x="14" y="28" class="head">렌더 lane</text><text x="14" y="50" class="small">DedicatedLane 전용 스레드 1개</text><text x="14" y="78" class="small">• 장치 소유(시작 때 이관)</text><text x="14" y="98" class="small">• packet → 렌더 그래프 구성</text><text x="14" y="118" class="small">• 기록·제출·present</text><text x="14" y="138" class="small">• 자원 생성·Retire·회수</text><text x="14" y="158" class="small">• 바인딩 snapshot 게시</text><text x="14" y="178" class="small">• 헤드리스·시험은 인라인 모드</text><text x="14" y="198" class="small">  (같은 스레드, 같은 FIFO 순서)</text></g>

<g transform="translate(372 370)"><rect class="io" width="250" height="110" rx="10"/><text x="14" y="28" class="head">IO 완료 worker</text><text x="14" y="50" class="small">AsyncIoContext (Core PlatformBase)</text><text x="14" y="78" class="small">• 텍스처 mip 덩어리 읽기</text><text x="14" y="98" class="small">• hash 검증·압축 해제</text></g>

<g transform="translate(706 84)"><rect class="gpu" width="230" height="210" rx="10"/><text x="14" y="28" class="head">GPU queue</text><text x="14" y="50" class="small">장치가 실행</text><text x="14" y="78" class="small">• graphics queue (1차)</text><text x="14" y="98" class="small">• async compute (RG4)</text><text x="14" y="118" class="small">• copy (결정 R6)</text><text x="14" y="146" class="small">완료는 GpuFencePoint</text><text x="14" y="166" class="small">(device epoch, queue, value)</text></g>

<g transform="translate(706 370)"><rect class="gpu" width="230" height="110" rx="10"/><text x="14" y="28" class="head">후속</text><text x="14" y="52" class="small">• GPU 제출 전용 lane</text><text x="14" y="72" class="small">• 병렬 기록(RG3)</text><text x="14" y="92" class="small">• 보조 직렬 pipe</text></g>

<path class="arrow" d="M274 140 H370"/><text x="284" y="132" class="lbl">프레임 packet</text>
<path class="arrow" d="M274 176 H370"/><text x="284" y="168" class="small">자원·표면 작업</text>
<path class="dash" d="M370 222 H276"/><text x="284" y="214" class="small">완료 통지</text>
<path class="arrow" d="M120 254 V328"/><text x="128" y="296" class="small">ParallelFor</text>
<path class="dash" d="M180 328 V256"/>
<path class="arrow" d="M622 140 H704"/><text x="630" y="132" class="lbl">Submit</text>
<path class="dash" d="M704 222 H624"/><text x="630" y="214" class="small">fence 완료</text>
<path class="arrow" d="M460 294 V368"/><text x="468" y="336" class="small">읽기 요청</text>
<path class="dash" d="M540 368 V296"/><text x="548" y="336" class="small">완료 이벤트</text>
</svg>
