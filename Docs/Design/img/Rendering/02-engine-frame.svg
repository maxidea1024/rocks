<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
<title id="title">엔진 한 프레임(RunFrame)의 여섯 단계</title>
<desc id="desc">이벤트 펌프, 시간 갱신, 프레임 시작 hook, World Tick, 지연 작업, 프레임 끝 hook. World Tick 안에서는 PrePhysics부터 PreRender까지 phase가 돈다. 프레임 끝에서 렌더 추출과 게시가 일어난다.</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#183142}.title{font-size:22px;font-weight:700}.head{font-size:14px;font-weight:700}.small{font-size:12px;fill:#405869}.num{font-size:20px;font-weight:700;fill:#507d96}
.step{fill:#f4f8fb;stroke:#bccfda}.render{fill:#fff5df;stroke:#e1ba63}.phase{fill:#e4f4ec;stroke:#69a789}.note{fill:#fafcfd;stroke:#e1e8ed}.arrow{stroke:#5c7385;stroke-width:2;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c7385"/></marker></defs>
<rect width="960" height="470" fill="#fff"/>
<text x="24" y="34" class="title">엔진 한 프레임: Engine::RunFrame의 여섯 단계</text>
<text x="24" y="58" class="small">게임 lane(메인·창 스레드)에서 순서대로 실행한다. 1·3·6단계는 실행 파일이 꽂는 hook이다(Engine은 창·그래픽을 모른다).</text>

<g transform="translate(16 76)"><rect class="step" width="140" height="92" rx="8"/><text x="12" y="28" class="num">1</text><text x="34" y="28" class="head">이벤트 펌프</text><text x="12" y="54" class="small">창 메시지·입력</text><text x="12" y="74" class="small">hook PumpEvents</text></g>
<g transform="translate(172 76)"><rect class="step" width="140" height="92" rx="8"/><text x="12" y="28" class="num">2</text><text x="34" y="28" class="head">시간 갱신</text><text x="12" y="54" class="small">실제 시간·프레임 번호</text><text x="12" y="74" class="small">World별 GameClock</text></g>
<g transform="translate(328 76)"><rect class="step" width="140" height="92" rx="8"/><text x="12" y="28" class="num">3</text><text x="34" y="28" class="head">프레임 시작</text><text x="12" y="54" class="small">hook BeginFrame</text><text x="12" y="74" class="small">OnFrameBegin</text></g>
<g transform="translate(484 76)"><rect class="phase" width="140" height="92" rx="8"/><text x="12" y="28" class="num">4</text><text x="34" y="28" class="head">World Tick</text><text x="12" y="54" class="small">World마다</text><text x="12" y="74" class="small">아래 phase 순서</text></g>
<g transform="translate(640 76)"><rect class="step" width="140" height="92" rx="8"/><text x="12" y="28" class="num">5</text><text x="34" y="28" class="head">지연 작업</text><text x="12" y="54" class="small">World 파괴 요청 처리</text><text x="12" y="74" class="small">OnFrameEnd</text></g>
<g transform="translate(796 76)"><rect class="render" width="148" height="92" rx="8"/><text x="12" y="28" class="num">6</text><text x="34" y="28" class="head">프레임 끝</text><text x="12" y="54" class="small">hook EndFrame</text><text x="12" y="74" class="small">렌더 추출·게시</text></g>
<path class="arrow" d="M156 122 H170"/><path class="arrow" d="M312 122 H326"/><path class="arrow" d="M468 122 H482"/><path class="arrow" d="M624 122 H638"/><path class="arrow" d="M780 122 H794"/>

<text x="24" y="206" class="head">4단계 안: World::Tick의 phase (열거 순서 = 실행 순서)</text>
<g transform="translate(24 218)">
<rect class="phase" width="150" height="62" rx="8"/><text x="12" y="26" class="head">PrePhysics</text><text x="12" y="46" class="small">입력 반영·게임 의도</text>
<rect class="phase" x="166" width="150" height="62" rx="8"/><text x="178" y="26" class="head">Physics × N</text><text x="178" y="46" class="small">고정 스텝 수만큼</text>
<rect class="phase" x="332" width="150" height="62" rx="8"/><text x="344" y="26" class="head">PostPhysics</text><text x="344" y="46" class="small">결과·이벤트 반영</text>
<rect class="phase" x="498" width="150" height="62" rx="8"/><text x="510" y="26" class="head">LateUpdate</text><text x="510" y="46" class="small">카메라 추적 등</text>
<rect class="phase" x="664" width="150" height="62" rx="8"/><text x="676" y="26" class="head">PreRender</text><text x="676" y="46" class="small">렌더 추출 준비</text>
<path class="arrow" d="M150 31 H164"/><path class="arrow" d="M316 31 H330"/><path class="arrow" d="M482 31 H496"/><path class="arrow" d="M648 31 H662"/>
<rect class="note" x="830" width="98" height="62" rx="8"/><text x="840" y="26" class="small">World Tick 끝</text><text x="840" y="46" class="small">파괴 · 증분 GC</text>
</g>
<text x="24" y="304" class="small">phase 경계마다 Tick 등록 변경을 반영하고(안전 지점), World Tick 끝에서 지연 파괴를 마친 뒤 예산 안에서 증분 GC를 진행한다.</text>

<text x="24" y="342" class="head">6단계 안: 게임 lane이 렌더 lane에 넘기는 일 (RenderBase 5절, 진행 중)</text>
<g transform="translate(24 354)">
<rect class="render" width="196" height="76" rx="8"/><text x="12" y="26" class="head">완료 통지 비우기</text><text x="12" y="46" class="small">readback·timestamp</text><text x="12" y="64" class="small">회수 완료·보임 신호</text>
<rect class="render" x="212" width="196" height="76" rx="8"/><text x="224" y="26" class="head">프레임 slot 확보</text><text x="224" y="46" class="small">빈 slot 없으면 대기</text><text x="224" y="64" class="small">(메시지 펌프하며)</text>
<rect class="render" x="424" width="196" height="76" rx="8"/><text x="436" y="26" class="head">프레임 packet 추출</text><text x="436" y="46" class="small">불변 값 + RenderHandle</text><text x="436" y="64" class="small">설정 snapshot</text>
<rect class="render" x="636" width="276" height="76" rx="8"/><text x="648" y="26" class="head">RenderLane::Post(packet)</text><text x="648" y="46" class="small">렌더 lane이 그래프를 만들고 제출한다</text><text x="648" y="64" class="small">게임 lane은 다음 프레임으로 넘어간다</text>
<path class="arrow" d="M196 38 H210"/><path class="arrow" d="M408 38 H422"/><path class="arrow" d="M620 38 H634"/>
</g>
</svg>
