name: Foundation
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install verified native formatter
        run: ./Build/InstallFormatter.ps1
      - name: Build and test Foundation through MSBuild
        run: dotnet msbuild Rocks.proj /t:Test /p:Configuration=Debug /p:RocksTarget=Foundation /v:minimal
      - name: Verify stable identity merge history
        if: github.event_name == 'pull_request'
        run: ./Build/CheckIdentityMerges.ps1 -MetaCompiler out/dotnet/bin/Rocks.MetaCompiler/Debug/net10.0/Rocks.MetaCompiler.dll
      - name: Build and test headless commandlet
        run: |
          dotnet msbuild Rocks.proj /t:Build /p:Configuration=Debug /p:RocksTarget=Commandlet /p:NativeOutput=out/ci-commandlet /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = if ($IsWindows) { 'out/ci-commandlet/bin/RocksCommandlet.exe' } else { 'out/ci-commandlet/bin/RocksCommandlet' }
          dotnet run --project Programs/Rocks.Commandlet.Tests -- --executable $executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # C++은 위에서 설치한 clang-format 21.1.6, C#은 global.json이 고정한 SDK의 dotnet format(Build/Format/Rocks.Format.slnx)이다.
      - name: Verify C++ and C# formatting
        run: dotnet out/dotnet/bin/Rocks.ToolTests/Debug/net10.0/Rocks.ToolTests.dll format --root .
      - name: Verify native action graph and incremental failures
        run: dotnet run --project Programs/Rocks.Build.Tests -- --root .
      - name: Verify installed SDK and external game
        run: dotnet run --project Programs/Rocks.Build.IntegrationTests -- --root .
      - name: AddressSanitizer
        run: dotnet msbuild Rocks.proj /t:Test /p:Configuration=Asan /p:RocksTarget=Foundation /v:minimal
      - name: Release with ThinLTO
        run: dotnet msbuild Rocks.proj /t:Test /p:Configuration=Release /p:RocksTarget=Foundation /v:minimal
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundation-${{ runner.os }}
          path: |
            out/**/foundation-report.json
            out/**/build-evidence.json
            out/**/*report.json
            out/**/*.log
