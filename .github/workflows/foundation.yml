name: Foundation
# Debug, format and changed-area tests run locally for every commit, so push runs only when the head commit message contains `[ci]`
# (end of a stage batch, or changes that may show up only on macOS). PRs and manual runs always run. Manual runs
# (workflow_dispatch) are available only when this file is on the default branch.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  native:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install verified native formatter
        run: ./Build/InstallFormatter.ps1
      # windows-latest (windows-2025-vs2026) ships MSVC STL 14.52, which rejects Clang older than 22 (STL1000), next to LLVM 20.
      # The pinned LLVM goes first on PATH so the build and the MetaCompiler use its clang-cl, lld-link and llvm-lib.
      - name: Install verified LLVM (Windows)
        if: runner.os == 'Windows'
        run: ./Build/InstallLlvm.ps1
      - name: Build and test Foundation through MSBuild
        run: dotnet msbuild Rocks.proj /t:Test /p:Adaptive=off /p:Configuration=Debug /p:RocksTarget=Foundation /v:minimal
      # Verification variant (Docs/Design/UnityBuildPch.ko.md section 11): every source is its own translation unit and no PCH is used, so a
      # missing include that unity batches or the PCH would hide fails here. Compiles and links only; the tests ran in the step above.
      - name: Build Foundation without unity batches and PCH
        if: runner.os == 'Windows'
        run: dotnet msbuild Rocks.proj /t:Build /p:Adaptive=off /p:Unity=off /p:Pch=off /p:Configuration=Debug /p:RocksTarget=Foundation /v:minimal
      - name: Verify stable identity merge history
        if: github.event_name == 'pull_request'
        run: ./Build/CheckIdentityMerges.ps1 -MetaCompiler out/dotnet/bin/Rocks.MetaCompiler/Debug/net10.0/Rocks.MetaCompiler.dll
      - name: Build and test headless commandlet
        run: |
          dotnet msbuild Rocks.proj /t:Build /p:Adaptive=off /p:Configuration=Debug /p:RocksTarget=Commandlet /p:NativeOutput=out/ci-commandlet /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = if ($IsWindows) { 'out/ci-commandlet/bin/RocksCommandlet.exe' } else { 'out/ci-commandlet/bin/RocksCommandlet' }
          dotnet run --project Programs/Rocks.Commandlet.Tests -- --executable $executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # C++ uses clang-format 21.1.6 installed above; C# uses dotnet format of the SDK pinned by global.json (Build/Format/Rocks.Format.slnx).
      - name: Verify C++ and C# formatting
        run: dotnet out/dotnet/bin/Rocks.ToolTests/Debug/net10.0/Rocks.ToolTests.dll format --root .
      - name: Verify native action graph and incremental failures
        run: dotnet run --project Programs/Rocks.Build.Tests -- --root .
      - name: Verify installed SDK and external game
        run: dotnet run --project Programs/Rocks.Build.IntegrationTests -- --root .
      - name: AddressSanitizer
        run: dotnet msbuild Rocks.proj /t:Test /p:Adaptive=off /p:Configuration=Asan /p:RocksTarget=Foundation /v:minimal
      - name: Release with ThinLTO
        run: dotnet msbuild Rocks.proj /t:Test /p:Adaptive=off /p:Configuration=Release /p:RocksTarget=Foundation /v:minimal
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundation-${{ runner.os }}
          path: |
            out/**/foundation-report.json
            out/**/build-evidence.json
            out/**/*report.json
            out/**/*.log
