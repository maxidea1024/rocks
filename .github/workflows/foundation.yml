name: Foundation
# Debug, format and changed-area tests run locally for every commit, so push runs only when the head commit message contains `[ci]`
# (end of a stage batch, or changes that may show up only on macOS). PRs and manual runs always run. Manual runs
# (workflow_dispatch) are available only when this file is on the default branch.
on:
  push:
  pull_request:
  workflow_dispatch:
# One run per commit: when the same commit is pushed to several branches (a feature branch and feature/engine-runtime), the
# newer run cancels the older one instead of running the identical build twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]')
    strategy:
      fail-fast: false
      # Windows uses the verified toolchain of Build/Toolchain.json (LLVM 22.1.8) with the image's default MSVC; macOS keeps the older
      # JSON AST shape covered (Apple clang 17), so both shapes run the meta tests (Docs/Design/ClangVersionSupport.ko.md section 6.3).
      matrix:
        include:
          - os: windows-latest
            leg: windows
          - os: macos-15
            leg: macos
    name: native (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    env:
      # Rocks.proj passes --require-verified-toolchain on: a compiler outside Build/Toolchain.json's verified list fails the build.
      RequireVerifiedToolchain: 'on'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install verified native formatter
        run: ./Build/InstallFormatter.ps1
      # The images default ANDROID_NDK_HOME to an NDK whose clang is below the Android minimum of Build/Toolchain.json; Rocks.Build.Tests
      # cross-builds with the NDK, so select the pinned one (android.ndk.version).
      - name: Select pinned Android NDK
        run: ./Build/SelectAndroidNdk.ps1
      # Windows puts the verified LLVM of Build/Toolchain.json first on PATH (the image's own LLVM is older than the STL accepts).
      - name: Install pinned LLVM (Windows)
        if: runner.os == 'Windows'
        run: ./Build/InstallLlvm.ps1
      # Setup wizard (Docs/Design/SetupWizard.ko.md): unit checks under both Windows shells (Setup.bat falls back to Windows PowerShell 5.1),
      # then the real check. The check reads the environment a new terminal gets, so Windows first writes the pinned LLVM (first on this job's
      # PATH) to the front of the system PATH and ROCKS_CLANG_FORMAT to the user environment; the runner is discarded after the job. The image
      # has no Windows SDK 10.0.22621, so the FXC SDK item (shader tests only) is skipped.
      - name: Setup wizard self test and check
        run: |
          if ($IsWindows) {
            ./Build/Setup.ps1 -SelfTest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            powershell -NoProfile -ExecutionPolicy Bypass -File Build/Setup.ps1 -SelfTest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $bin = Split-Path -Parent (Get-Command clang-cl).Source
            [Environment]::SetEnvironmentVariable('Path', "$bin;" + [Environment]::GetEnvironmentVariable('Path', 'Machine'), 'Machine')
            [Environment]::SetEnvironmentVariable('ROCKS_CLANG_FORMAT', $env:ROCKS_CLANG_FORMAT, 'User')
            git config --global core.longpaths true
            ./Build/Setup.ps1 -Check -Skip 'FXC SDK'
            exit $LASTEXITCODE
          }
          sh ./Setup.sh --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sh ./Setup.sh --check
          exit $LASTEXITCODE
      - name: Build and test Foundation through MSBuild
        run: dotnet msbuild Rocks.proj /t:Test /p:Adaptive=off /p:Configuration=Debug /p:RocksTarget=Foundation /v:minimal
      # IDE project files model (Docs/Design/ProjectFiles.ko.md section 16 V1): every engine target and configuration is planned in IDE mode,
      # every folded IntelliSense value round-trips to its command, and the Foundation Debug commands equal the compile database the step
      # above wrote. Runs before the verification variant below, which rewrites that compile database without PCH.
      - name: Check the Visual Studio project files model
        if: matrix.leg == 'windows'
        run: dotnet out/dotnet/bin/Rocks.Build.Cli/Debug/net10.0/Rocks.Build.Cli.dll projectfiles --root . --model-only on --compare-compile-db out/dotnet-windows-foundation-debug/compile_commands.json --target Foundation --configuration Debug
      # Writes Rocks.slnx and out/ProjectFiles (render, write-if-changed, state file) on the runner's toolchain.
      - name: Write the Visual Studio project files
        if: matrix.leg == 'windows'
        run: dotnet out/dotnet/bin/Rocks.Build.Cli/Debug/net10.0/Rocks.Build.Cli.dll projectfiles --root .
      # Verification variant (Docs/Design/UnityBuildPch.ko.md section 11): every source is its own translation unit and no PCH is used, so a
      # missing include that unity batches or the PCH would hide fails here. Compiles and links only; the tests ran in the step above.
      - name: Build Foundation without unity batches and PCH
        if: matrix.leg == 'windows'
        run: dotnet msbuild Rocks.proj /t:Build /p:Adaptive=off /p:Unity=off /p:Pch=off /p:Configuration=Debug /p:RocksTarget=Foundation /v:minimal
      - name: Verify stable identity merge history
        if: github.event_name == 'pull_request'
        run: ./Build/CheckIdentityMerges.ps1 -MetaCompiler out/dotnet/bin/Rocks.MetaCompiler/Debug/net10.0/Rocks.MetaCompiler.dll
      - name: Build EngineTests (Windows)
        if: runner.os == 'Windows'
        run: dotnet msbuild Rocks.proj /t:Build /p:Adaptive=off /p:Configuration=Debug /p:RocksTarget=EngineTests /p:NativeOutput=out/ci-engine /v:minimal
      - name: Build and test headless commandlet
        run: |
          dotnet msbuild Rocks.proj /t:Build /p:Adaptive=off /p:Configuration=Debug /p:RocksTarget=Commandlet /p:NativeOutput=out/ci-commandlet /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = if ($IsWindows) { 'out/ci-commandlet/bin/RocksCommandlet.exe' } else { 'out/ci-commandlet/bin/RocksCommandlet' }
          dotnet run --project Programs/Rocks.Commandlet.Tests -- --executable $executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Modular linking (Docs/Design/BuildTargets.ko.md section 3.8 BS8d2, BS8d5): the FoundationTests module closure links as shared libraries
      # without missing exports, and the tests run through the Modular entry (Docs/Design/ModuleLoader.ko.md section 3.14).
      - name: Test FoundationTests as Modular
        run: dotnet msbuild Rocks.proj /t:Test /p:Adaptive=off /p:Configuration=Debug /p:RocksTarget=FoundationModular /p:NativeOutput=out/ci-modular /v:minimal
      # C++ uses clang-format 21.1.6 installed above; C# uses dotnet format of the SDK pinned by global.json (Build/Format/Rocks.Format.slnx).
      - name: Verify C++ and C# formatting
        run: dotnet out/dotnet/bin/Rocks.ToolTests/Debug/net10.0/Rocks.ToolTests.dll format --root .
      - name: Verify native action graph and incremental failures
        run: dotnet run --project Programs/Rocks.Build.Tests -- --root .
      - name: Verify installed SDK and external game
        run: dotnet run --project Programs/Rocks.Build.IntegrationTests -- --root .
      - name: AddressSanitizer
        run: dotnet msbuild Rocks.proj /t:Test /p:Adaptive=off /p:Configuration=Asan /p:RocksTarget=Foundation /v:minimal
      - name: Release with ThinLTO
        run: dotnet msbuild Rocks.proj /t:Test /p:Adaptive=off /p:Configuration=Release /p:RocksTarget=Foundation /v:minimal
      # Compiled-out log templates must be absent from the Release link result (Docs/Design/LoggingSystem.ko.md section 7). The check fails
      # when the executable is missing, so it always inspects the LogBench built from this commit.
      - name: Release LogBench excludes compiled-out log templates
        run: |
          dotnet msbuild Rocks.proj /t:Build /p:Adaptive=off /p:Configuration=Release /p:RocksTarget=LogBench /p:NativeOutput=out/ci-logbench-release /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = if ($IsWindows) { 'out/ci-logbench-release/bin/LogBench.exe' } else { 'out/ci-logbench-release/bin/LogBench' }
          dotnet out/dotnet/bin/Rocks.ToolTests/Debug/net10.0/Rocks.ToolTests.dll log-release --root . --native-executable $executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundation-${{ matrix.leg }}
          path: |
            out/**/foundation-report.json
            out/**/build-evidence.json
            out/**/*report.json
            out/**/*.log
